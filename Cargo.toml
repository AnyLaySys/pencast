[package]
name = "pencast"
version = "0.1.0"
edition = "2024"
[target.'cfg(target_os = "windows")'.dependencies]
jpeg-decoder = "=0.3.2"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "=0.62.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
panic = "abort"
strip = true